name: Mental Modeling · daily papers

on:
  schedule:
    - cron: '0 1 * * *' # 09:00 Asia/Shanghai
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      verify_sources:
        description: 'Verify real discovery and Chinese method briefs without publishing a new issue'
        type: boolean
        default: false

permissions:
  contents: read
concurrency:
  group: mental-modeling-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Validate scope, deduplication, and archive invariants
        run: python -m unittest discover -s tests -v
      - uses: actions/cache/restore@v4
        if: github.event_name != 'push'
        id: model-cache
        with:
          path: .cache/summary
          key: summary-ubuntu-b10995-qwen25-7b-q4-v1
      - name: Prepare local Chinese paper editor
        if: github.event_name != 'push'
        run: python scripts/prepare_summary.py
      - uses: actions/cache/save@v4
        if: github.event_name != 'push' && steps.model-cache.outputs.cache-hit != 'true'
        with:
          path: .cache/summary
          key: summary-ubuntu-b10995-qwen25-7b-q4-v1
      - name: Verify live daily pipeline
        if: github.event_name == 'workflow_dispatch' && inputs.verify_sources
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/update.py --dry-run --output .cache/verified-issue.json
      - name: Generate today's three papers
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.verify_sources)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/update.py
      - name: Build and validate site
        run: |
          python scripts/build.py
          python scripts/check_site.py
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name != 'push'
        with:
          name: pipeline-verification
          path: |
            .cache/verified-issue.json
            .cache/source-report.json
            .cache/selection-review.json
            .cache/preview.json
            .cache/summary/server.log
          retention-days: 3
      - name: Save immutable issue and permanent history
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/issues data/history.json site/index.html site/archive.html site/archive site/.nojekyll
          if ! git diff --cached --quiet; then
            git commit -m "chore: publish mental modeling edition $(TZ=Asia/Shanghai date +%F)"
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
