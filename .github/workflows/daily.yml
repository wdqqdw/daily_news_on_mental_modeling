name: Mental Modeling · research library

on:
  schedule:
    - cron: '0 1 * * *' # 09:00 Asia/Shanghai
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      verify_sources:
        description: 'Verify discovery and Chinese research notes without changing the library'
        type: boolean
        default: false
      discovery_only:
        description: 'Check all recent/historical sources without starting the summary model'
        type: boolean
        default: false

permissions:
  contents: read
concurrency:
  group: mental-modeling-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Validate scope, deduplication, and archive invariants
        run: python -m unittest discover -s tests -v
      - uses: actions/cache/restore@v4
        if: github.event_name != 'push' && !inputs.discovery_only
        id: model-cache
        with:
          path: .cache/summary
          key: summary-ubuntu-b10995-qwen25-7b-q4-v1
      - name: Prepare local Chinese paper editor
        if: github.event_name != 'push' && !inputs.discovery_only
        run: python scripts/prepare_summary.py
      - uses: actions/cache/save@v4
        if: github.event_name != 'push' && !inputs.discovery_only && steps.model-cache.outputs.cache-hit != 'true'
        with:
          path: .cache/summary
          key: summary-ubuntu-b10995-qwen25-7b-q4-v1
      - name: Verify live library collection
        if: github.event_name == 'workflow_dispatch' && inputs.verify_sources && !inputs.discovery_only
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/update_library.py --dry-run --max-attempts 2 --max-reviews 8 --output .cache/verified-library.json
      - name: Check all recent and historical sources
        if: github.event_name == 'workflow_dispatch' && inputs.discovery_only
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import datetime, sys, urllib.request, urllib.error, urllib.parse, time
          sys.path.insert(0, 'scripts')
          from library_sources import arxiv_query, ARXIV_THEMES, AGENT
          from zoneinfo import ZoneInfo
          today = datetime.datetime.now(ZoneInfo('Asia/Shanghai')).date()
          original = arxiv_query(ARXIV_THEMES['world'], today)
          params = dict(urllib.parse.parse_qsl(urllib.parse.urlsplit(original).query))
          variants = [('original', original)]
          for name, changes in [('simple', {'search_query':'ti:"mental world model"'}), ('undated', {'search_query':params['search_query'].split(' AND submittedDate:')[0]}), ('relevance', {'sortBy':'relevance'})]:
              variants.append((name, 'https://export.arxiv.org/api/query?' + urllib.parse.urlencode({**params, **changes})))
          for name, url in variants:
              try:
                  with urllib.request.urlopen(urllib.request.Request(url, headers={'User-Agent':AGENT}), timeout=40) as response:
                      print('ARXIV DIAGNOSTIC', name, response.status, dict(response.headers), response.read(300).decode(), flush=True)
              except urllib.error.HTTPError as error:
                  print('ARXIV DIAGNOSTIC', name, error.code, dict(error.headers), error.read(1500).decode(errors='replace'), flush=True)
              time.sleep(3.1)
          PY
          python scripts/update_library.py --discover-only
      - name: Search recent and historical papers including arXiv
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.verify_sources && !inputs.discovery_only)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/update_library.py
      - name: Build and validate site
        run: |
          python scripts/build.py
          python scripts/check_site.py
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name != 'push'
        with:
          name: pipeline-verification
          path: |
            .cache/verified-library.json
            .cache/source-report.json
            .cache/library-review.json
            .cache/library-preview.json
            .cache/summary/server.log
          retention-days: 3
      - name: Save cumulative library and collection status
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/library.json data/collection_status.json data/collection_state.json site/index.html site/collection-status.json site/.nojekyll
          if ! git diff --cached --quiet; then
            git commit -m "chore: collect mental modeling papers $(TZ=Asia/Shanghai date +%F)"
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
